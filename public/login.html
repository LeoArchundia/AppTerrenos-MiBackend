<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Terrenos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Bienvenido</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label>Correo Electrónico</label>
            <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="mt-3 text-center">
       ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>Regístrate aquí</a>
    </p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.success) {
                // GUARDAR TOKEN Y DATOS DEL USUARIO
                localStorage.setItem('token', data.token);
                localStorage.setItem('userId', data.userId); // Importante para apartar
                localStorage.setItem('role', data.role);

                alert('¡Bienvenido!');
                
                // Redirigir según rol
                if (data.role === 'admin') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/'; // Al mapa
                }
            } else {
                alert('Error: ' + data.mensaje);
            }
        } catch (error) {
            console.error(error);
            alert('Error de conexión');
        }
    });
</script>

</body>
</html>
