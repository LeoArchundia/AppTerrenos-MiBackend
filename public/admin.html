<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Terrenos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .nav-tabs .nav-link.active { background-color: #0d6efd; color: white; }
        .nav-link { color: #495057; cursor: pointer; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🏢 Admin Terrenos</a>
        <button onclick="cerrarSesion()" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
    </div>
</nav>

<div class="container">
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link active" onclick="cambiarTab('dashboard')">📊 Dashboard</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" onclick="cambiarTab('inventario')">📝 Gestión de Terrenos</a>
        </li>
    </ul>

    <div id="vista-dashboard">
        <div class="row text-center mb-4">
            <div class="col-md-3">
                <div class="card p-3 bg-primary text-white">
                    <h3>Total</h3> <h2 id="kpi-total">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 bg-success text-white">
                    <h3>Disponible</h3> <h2 id="kpi-disponible">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 bg-warning text-white">
                    <h3>Apartado</h3> <h2 id="kpi-apartado">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 bg-danger text-white">
                    <h3>Vendido</h3> <h2 id="kpi-vendido">0</h2>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <canvas id="miGrafica"></canvas>
            </div>
        </div>
    </div>

    <div id="vista-inventario" style="display: none;">
        <div class="d-flex justify-content-between mb-3">
            <h3>Inventario de Lotes</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCrear">+ Nuevo Terreno</button>
        </div>
        
        <table class="table table-striped bg-white shadow-sm rounded">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Precio</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-terrenos">
                </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="modalCrear" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Registrar Nuevo Terreno</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formCrear">
                    <div class="mb-2">
                        <label>Código (Ej. L-50)</label>
                        <input type="text" id="newCode" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Tamaño (m²)</label>
                        <input type="number" id="newSize" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Precio ($)</label>
                        <input type="number" id="newPrice" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>GeoJSON (Coordenadas)</label>
                        <textarea id="newGeojson" class="form-control" rows="3" placeholder='Pegar aquí: {"type":"Feature" ...}' required></textarea>
                        <small class="text-muted">Copia una "feature" del archivo map.geojson</small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 1. SEGURIDAD: Verificar si es admin
    const role = localStorage.getItem('role');
    if (role !== 'admin') {
        alert("Acceso denegado. Solo administradores.");
        window.location.href = '/login';
    }

    // 2. CARGAR DASHBOARD
    async function cargarDashboard() {
        const res = await fetch('/api/terrenos/dashboard-stats');
        const data = await res.json();
        
        document.getElementById('kpi-total').innerText = data.total;
        document.getElementById('kpi-disponible').innerText = data.disponible;
        document.getElementById('kpi-apartado').innerText = data.apartado;
        document.getElementById('kpi-vendido').innerText = data.vendido;

        new Chart(document.getElementById('miGrafica'), {
            type: 'pie',
            data: {
                labels: ['Disponible', 'Apartado', 'Vendido'],
                datasets: [{
                    data: [data.disponible, data.apartado, data.vendido],
                    backgroundColor: ['#198754', '#ffc107', '#dc3545']
                }]
            }
        });
    }

    // 3. CARGAR TABLA DE INVENTARIO
    async function cargarInventario() {
        const res = await fetch('/api/terrenos'); // Reutilizamos la ruta pública
        const terrenos = await res.json();
        
        const tbody = document.getElementById('tabla-terrenos');
        tbody.innerHTML = ''; // Limpiar

        terrenos.forEach(t => {
            tbody.innerHTML += `
                <tr>
                    <td>${t.LandId || t.id}</td> <td><strong>${t.Code}</strong></td>
                    <td>$${t.Price}</td>
                    <td><span class="badge ${getColor(t.Status)}">${t.Status}</span></td>
                    <td><button class="btn btn-sm btn-info">Editar</button></td>
                </tr>
            `;
        });
    }

    function getColor(status) {
        if(status === 'Disponible') return 'bg-success';
        if(status === 'Apartado') return 'bg-warning';
        return 'bg-danger';
    }

    // 4. CREAR NUEVO TERRENO
    document.getElementById('formCrear').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            // Intentar leer el JSON
            let geojsonObj;
            try {
                geojsonObj = JSON.parse(document.getElementById('newGeojson').value);
            } catch (err) {
                alert("El GeoJSON no es válido. Revisa las comillas y llaves.");
                return;
            }

            const body = {
                code: document.getElementById('newCode').value,
                size: document.getElementById('newSize').value,
                price: document.getElementById('newPrice').value,
                geojson: geojsonObj
            };

            const res = await fetch('/api/terrenos/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            
            const data = await res.json();
            if(data.success) {
                alert("Terreno creado exitosamente");
                location.reload();
            } else {
                alert("Error: " + data.mensaje);
            }

        } catch (error) {
            console.error(error);
            alert("Error de conexión");
        }
    });

    // FUNCIONES DE UTILIDAD
    function cambiarTab(tab) {
        if (tab === 'dashboard') {
            document.getElementById('vista-dashboard').style.display = 'block';
            document.getElementById('vista-inventario').style.display = 'none';
            document.querySelectorAll('.nav-link')[0].classList.add('active');
            document.querySelectorAll('.nav-link')[1].classList.remove('active');
        } else {
            document.getElementById('vista-dashboard').style.display = 'none';
            document.getElementById('vista-inventario').style.display = 'block';
            document.querySelectorAll('.nav-link')[0].classList.remove('active');
            document.querySelectorAll('.nav-link')[1].classList.add('active');
            cargarInventario();
        }
    }

    function cerrarSesion() {
        localStorage.clear();
        window.location.href = '/login';
    }

    // Iniciar
    cargarDashboard();
</script>

</body>
</html>
