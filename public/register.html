<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Terrenos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .register-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center mb-4">Crear Cuenta</h3>
    <form id="registerForm">
        <div class="mb-3">
            <label>Nombre Completo</label>
            <input type="text" id="fullname" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Correo Electrónico</label>
            <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" id="password" class="form-control" required minlength="4">
        </div>
        <button type="submit" class="btn btn-success w-100">Registrarse</button>
    </form>
    <p class="mt-3 text-center">
        ¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a>
    </p>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // 1. Obtener datos del formulario
        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            // 2. Enviar al Backend
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullname, email, password })
            });

            const data = await res.json();

            // 3. Respuesta
            if (data.success) {
                alert('¡Registro exitoso! Ahora inicia sesión.');
                window.location.href = '/login'; // Mandar al login
            } else {
                alert('Error: ' + data.mensaje);
            }
        } catch (error) {
            console.error(error);
            alert('Error al conectar con el servidor');
        }
    });
</script>

</body>
</html>
