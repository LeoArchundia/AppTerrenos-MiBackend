<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Terrenos</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { block-size: 100vh; inline-size: 100%; } /* El mapa ocupa toda la pantalla */
        
        /* Caja de información flotante */
        .info-box {
            position: absolute;
            inset-block-start: 10px;
            inset-inline-end: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            z-index: 1000; /* Para que quede encima del mapa */
            inline-size: 250px;
        }
        .status-dot { block-size: 10px; inline-size: 10px; display: inline-block; border-radius: 50%; margin-inline-end: 5px; }
        .disponible { background-color: #28a745; } /* Verde */
        .vendido { background-color: #dc3545; }    /* Rojo */
        .apartado { background-color: #ffc107; }   /* Amarillo */
    </style>
</head>
<body>

    <div class="info-box">
        <h3>🏡 Proyecto Terrenos</h3>
        <p><span class="status-dot disponible"></span> Disponible</p>
        <p><span class="status-dot apartado"></span> Apartado</p>
        <p><span class="status-dot vendido"></span> Vendido</p>
        <hr>
        <p id="info-seleccion">Selecciona un terreno...</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- A. INICIALIZAR EL MAPA ---
        // Coordenadas centrales de tus terrenos (aprox según tu JSON)
        const map = L.map('map').setView([20.535, -99.93], 14);

        // Capa base (el mapa de calles tipo Google Maps pero gratis)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // --- B. FUNCIÓN PARA OBTENER DATOS DEL BACKEND ---
        async function cargarTerrenos() {
            try {
                // 1. Pedimos los datos a TU servidor
                const respuesta = await fetch('/api/terrenos');
                const listaTerrenos = await respuesta.json();

                // 2. Recorremos cada terreno para dibujarlo
                listaTerrenos.forEach(terreno => {
                    // Decidir color según estado
                    let color = '#28a745'; // Verde por defecto
                    if (terreno.estado === 'vendido') color = '#dc3545'; // Rojo
                    if (terreno.estado === 'apartado') color = '#ffc107'; // Amarillo

                    // 3. Dibujar el GeoJSON en el mapa
                    L.geoJSON(terreno.ubicacion, {
                        style: {
                            color: color,
                            weight: 3,
                            opacity: 0.8
                        },
                        onEachFeature: function (feature, layer) {
                            // Cuando le den clic al terreno
                            layer.on('click', () => {
                                mostrarInfo(terreno);
                            });
                            // Popup simple
                            layer.bindPopup(`
                                <b>${terreno.codigo}</b><br>
                                Estado: ${terreno.estado}<br>
                                Precio: $${terreno.precio}
                            `);
                        }
                    }).addTo(map);
                });

            } catch (error) {
                console.error("Error cargando mapa:", error);
                alert("Error al conectar con el servidor.");
            }
        }

        // --- C. MOSTRAR INFO EN LA CAJA FLOTANTE ---
        // --- C. MOSTRAR INFO EN LA CAJA FLOTANTE ---
        function mostrarInfo(t) {
            const div = document.getElementById('info-seleccion');
            div.innerHTML = `
                <strong>${t.codigo}</strong><br>
                Precio: $${t.precio.toLocaleString()}<br>
                Estado: <b>${t.estado.toUpperCase()}</b>
                <br><br>
                ${t.estado === 'disponible' 
                    ? `<button onclick="enviarApartado(${t.id})" style="background:green; color:white; border:none; padding:5px 10px; cursor:pointer;">Apartar Ahora</button>` 
                    : '<small>No disponible para venta</small>'}
            `;
        }

        // --- D. FUNCIÓN QUE SE ACTIVA AL DAR CLIC AL BOTÓN ---
        async function enviarApartado(idTerreno) {
            if(!confirm("¿Estás seguro de apartar este terreno?")) return;

            try {
                const res = await fetch('/api/terrenos/apartar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: idTerreno })
                });
                
                const data = await res.json();

                if (data.success) {
                    alert(data.mensaje);
                    location.reload(); // Recargamos la página para ver el cambio de color
                } else {
                    alert("Error: " + data.mensaje);
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión");
            }
        }

        // ¡Arrancamos!
        cargarTerrenos();
    </script>
</body>
</html>
