<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmobiliaria Vista Azure | Inicio</title>
    <style>
        body {
            /* Mantiene el degradado de fondo original */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Nuevo contenedor para centrar todo y darle un efecto de tarjeta */
        .main-container {
            text-align: center;
            padding: 40px 60px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.15); /* Fondo semitransparente */
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            max-width: 600px;
        }

        h1 { 
            font-size: 2.8em; 
            margin-bottom: 5px; /* Menos espacio */
            letter-spacing: 1px;
            font-weight: 700;
        }

        p { 
            font-size: 1.2em; 
            margin-bottom: 30px; 
            opacity: 0.8; /* Ligeramente transparente */
        }

        .btn-group {
            display: flex;
            gap: 20px; /* Espacio uniforme entre botones */
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        /* Estilo para el botón Mapa */
        .btn-mapa {
            background-color: #ffffff;
            color: #764ba2;
        }

        /* Estilo para el botón Ingresar (usando el verde de tu mapa) */
        .btn-ingresar {
            background-color: #2ecc71;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Bienvenido</h1>
        
        <p>Sistema de gestión y venta de terrenos inteligentes.</p>

        <div class="btn-group">
            <a href="/mapa.html" class="btn btn-mapa">
                🗺️ Ver Mapa
            </a>

            <a href="/login.html" class="btn btn-ingresar">
                👤 Ingresar
            </a>
        </div>
    </div>
</body>
</html>
